
name: CI

on:
  push:
    branches: [ develop, 'feature/**' ]
  pull_request:
    branches: [ develop, main ]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # SonarCloud necesita el historial para PR decoration
          fetch-depth: 0

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      # Compila + tests + genera XML de JaCoCo que usará Sonar
      - name: Tests + JaCoCo
        run: ./gradlew clean test jacocoTestReport --no-daemon

      # (Opcional) sube reportes como artefactos para inspección
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            build/test-results/test
            build/reports/tests/test
            build/reports/jacoco/test

      # Análisis en SonarCloud con rutas explícitas para binarios y reportes
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # requerido para PR decoration
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}     # crea este secret en GitHub
        with:
          args: >
            -Dsonar.projectKey=juansrg95_ReservaCanchaF
            -Dsonar.organization=juansrg95
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.gradle.skipCompile=true
            -Dsonar.java.binaries=build/classes/java/main
            -Dsonar.junit.reportPaths=build/test-results/test
            -Dsonar.coverage.jacoco.xmlReportPaths=build/reports/jacoco/test/jacocoTestReport.xml






