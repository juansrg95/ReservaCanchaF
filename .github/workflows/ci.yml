name: CI

on:
  push:
    branches: [ develop, 'feature/**' ]
  pull_request:
    branches: [ develop, main ]

# Necesario para que SonarCloud comente y muestre resultado en PRs
permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1) Checkout del código
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Recomendado por Sonar para análisis correcto

      # 2) Configurar JDK 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # 3) Dar permisos de ejecución a gradlew
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4) Cache de Gradle (acelera builds)
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 5) Compilar
      - name: Build
        run: ./gradlew clean build --no-daemon

      # 6) Ejecutar tests
      - name: Run tests
        run: ./gradlew test --no-daemon

      # 7) Subir reportes de tests como artefacto (opcional)
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/test-results/test

      # 8) Análisis con SonarCloud
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}     # Token automático de GitHub
          SONAR_TOKEN:  ${{ secrets.sonar-token }}      # Token que creaste en Settings > Secrets


